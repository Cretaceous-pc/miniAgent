[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniagent"
version = "0.1.0"
description = "从零实现的最小可用 Agent Runtime（文档问答），CLI + Web 双入口，零第三方依赖"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "miniAgent" }]
# 有意留空：运行时只用标准库
dependencies = []

[project.scripts]
miniagent = "miniagent.dispatch:main"

[tool.setuptools]
packages = ["miniagent", "miniagent.tools", "miniagent.runtime", "miniagent.context",
            "miniagent.store", "miniagent.web"]
py-modules = ["main"]

[tool.setuptools.package-data]
"miniagent.web" = ["*.html"]
